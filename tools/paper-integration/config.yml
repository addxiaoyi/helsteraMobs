debug:
  self-test: true
  self-test-model: example/emberling
  self-test-delay-ticks: 40
  self-test-entity-options: true
  self-test-item-effects: true
  self-test-item-group-cooldown: false
  self-test-loot: true
  self-test-death-loot: true
  self-test-spawner: true
  self-test-spawner-persistence: false
  self-test-spawner-persistence-stage: write
  self-test-events: true
  trace-triggers: true
  self-test-audience: true
  self-test-execution-audience: true
  self-test-execution-audience-mob: true
  self-test-execution-audience-persistence: false
  self-test-execution-audience-persistence-stage: write
  self-test-skilltree-persistence: false
  self-test-skilltree-stage: write
  self-test-show-health: false
web:
  enabled: false
compatibility:
  mythicmobs: false
  itemadder: false
  craftengine: false
mythic-parity:
  show-health:
    radius: 25
    format: 'SHOW_HEALTH_PROBE|$mobname|$percent|$mobhp|$mobmaxhp'
ai:
  factions:
    players: guards
    block-friendly-fire: true
    factions:
      guards:
        display: Guards
      undead:
        display: Undead
