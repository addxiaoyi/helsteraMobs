# ==========================================================================
#  掉落表（loot.yml）
# ==========================================================================
#  被 mobs/<id>.yml 的 drops.table 引用，在生物死亡时投掷。
#
#  tables.<表名>.luck-factor
#     幸运加成系数：击杀者的幸运值（默认 0.05）乘以此值，加到 chance 上。
#     设为 0 则完全不吃幸运加成。
#
#  entries[] 每一条可写字段：
#     item               物品 ID。
#                        - 原版材质：DIAMOND / DIAMOND_SWORD / GOLDEN_APPLE
#                        - 自定义命名空间：helstera:ember_shard（需装 ItemAdder/CraftEngine，
#                          否则回落到去掉命名空间后的材质名）
#     amount-min/max     数量区间（含两端），默认 1/1
#     chance             掉落概率 0..1，默认 1.0（必掉）
#     luck-scaling       是否吃幸运加成，默认 true
#     enchantments       附魔，如 SHARPNESS: 3、LOOTING: 2
#     name               自定义显示名（支持 § 颜色码）
#     custom-model-data  自定义模型数据值（配合资源包）
#     glow               是否强制发光
#     tiers[]            数量分层权重（可选），用于表达偏斜分布，如
#                        「70% 掉 1 个 / 25% 掉 2~3 个 / 5% 掉 5 个」。
#                        配了 tiers 就忽略 amount-min/max。每档写：
#                          weight        权重，必须 > 0
#                          amount-min/max 该档数量区间
#                          note          备注，仅供调试
#     min-tier-level     击杀者档位门槛（可选）：低于该档位不掉这条。
#                        档位由击杀者的权限节点 helstera.tier.<n> 决定，
#                        取其最大值，扫描范围 1~10。拿不到击杀者（环境死亡）
#                        或没有该节点时按「档位未知」处理，门槛一律放行，
#                        不会因为读不到档位就把高端掉落吞掉。
#
#  用法：
#     mobs/crystal_boss.yml 里写
#       drops:
#         table: boss_loot
#         luck: true          # 把击杀者的幸运值计入
# ==========================================================================
tables:
  # ---- 示例：普通怪 ----
  common:
    entries:
      - item: BREAD
        amount-min: 1
        amount-max: 3
        chance: 0.6
      - item: IRON_INGOT
        amount-min: 1
        amount-max: 2
        chance: 0.25

  # ---- 示例：精英怪，带自定义模型数据 ----
  elite:
    luck-factor: 0.08
    entries:
      - item: DIAMOND
        amount-min: 1
        amount-max: 2
        chance: 0.4
      # 数量偏斜：绝大多数 1 个，偶尔一簇
      - item: GOLDEN_APPLE
        chance: 0.7
        luck-scaling: false
        tiers:
          - {weight: 70, amount-min: 1, amount-max: 1}
          - {weight: 25, amount-min: 2, amount-max: 3}
          - {weight: 5,  amount-min: 5, amount-max: 5}
      - item: DIAMOND_SWORD
        chance: 0.08
        enchantments:
          SHARPNESS: 3
          UNBREAKING: 2
        name: "§b§l远古结晶刃"
        custom-model-data: 1001
        glow: true
      # 只掉给 5 档及以上的击杀者（需要 helstera.tier.5 权限）
      - item: NETHERITE_INGOT
        chance: 0.02
        min-tier-level: 5