# ============================================================================
# 刷怪点配置
#
# 顶层键 spawners 下每个子键是一个刷怪点，键名即刷怪点 id（大小写不敏感）。
# 所有刷怪点共用一个调度节拍，各自按 interval 计时，不会每个刷怪点起一个任务。
# ============================================================================

spawners:

  # ---- 示例 1：常规野外怪，24 格内至少 1 名玩家才刷 ----
  wild_mob:
    # mobs/<mobId>.yml 里的生物 id（不含 .yml）
    mob: wild_mob
    # 留空则用主世界；世界不存在时该刷怪点整条跳过并在日志中告警
    world: ""
    x: 120.5
    y: 64
    z: -48.5
    # 圆内均匀随机取点（sqrt 保证不向圆心聚集），再向下吸附到地面
    radius: 8.0
    # y 方向抖动范围，避免所有生物严格同高
    y-range: 2.0
    # 生成间隔（tick）。20 = 1 秒，200 = 10 秒。低于 20 会被抬到 20。
    interval: 200
    # 同时存活数量上限，按「本刷怪点已生成」计数，
    # 因此多个刷怪点之间不抢名额
    max-alive: 3
    # 单次会话累计生成上限，0 表示不限
    max-spawns: 0
    # 人数门控：范围内玩家不足则不刷。0 表示不限制。
    min-players: 1
    # 数人的判定半径（格）。与 min-players 相互独立：
    # 前者是「需要几名玩家」，这个是「在多大范围内数」。
    players-radius: 24.0
    enabled: true

  # ---- 示例 2：洞穴 Boss 房，全服时段无人时不刷 ----
  cave_boss:
    mob: crystal_boss
    world: ""
    x: -820.0
    y: 12
    z: 640.0
    radius: 3.0
    interval: 1200        # 1 分钟一只
    max-alive: 1
    # 只在 3 人以上聚集时出，避免单人farm
    min-players: 3
    players-radius: 32.0
    enabled: true

  # ---- 示例 3：固定点精英，只生成一次总量 ----
  # 键名不要用 on / off / yes / no：YAML 1.1 会把它们解析成布尔值，
  # 键名最终变成 "true" / "false"，看起来像配置写对了却读不到。
  world_boss_elite:
    mob: elite_guard
    world: ""
    x: 0.5
    y: 70
    z: 0.5
    radius: 2.0
    interval: 2400
    max-alive: 1
    max-spawns: 3         # 本次开服最多 3 只，之后不再刷
    enabled: false        # 默认关，按需开启