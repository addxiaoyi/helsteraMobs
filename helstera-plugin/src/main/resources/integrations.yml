# 可选互通：将原生 MythicMobs 生物绑定为 helstera 模型。
# 核心模型/动画/AI 不依赖 MythicMobs。
#
# 方式一：生成事件结束后一 tick 自动绑定；取消生成、重复绑定、未知模型、
# 未知动画或非法缩放不会新增实例。卸载模型保留原生生物。
# mythicmobs:
#   mobs:
#     SkeletalKnight:
#       model: example/emberling
#       scale: 1.2
#       default-animation: idle
#
# 方式二：MM 5.7.2 模型扩展（其他版本需独立验证）。使用命名括号参数和明确目标：
#   Skills:
#   - modelspawn{model=example/emberling;scale=1.2;animation=idle;loop=true} @self
#   - modelplay{animation=walk;loop=true;priority=7} @self
#   - modelstop{animation=walk} @self
#   - modelstop{} @self
#   - modelscale{scale=1.5} @self
#   - modelremove{} @self
#
# m 别名：modelspawn 的 model；modelplay/modelstop/modelplaying 的 animation；
# modelscale 的 scale。不可与完整键同时使用；重复键、未知键拒绝执行。
# 不支持位置参数：MM 5.7.2 会在加载事件前丢弃部分尾随文本，桥接无法检测该文本。
# 模型与动画为已加载的字面 ID；scale 必须有限且 > 0，loop 为 true/false，priority 为整数。
# MM 自身的 delay/cooldown/repeat/forcesync 等执行选项仍由 MM 处理。
#
# Conditions / TargetConditions 支持 true/false 后缀：
#   - modelspawned true
#   - modelremoved false
#   - modelplaying{animation=walk} true
# modelremoved 表示有效实体没有模型绑定。modelplaying 可省略 animation，暂停不算播放。
# 无效参数、停用代理和异步条件求值均拒绝通过，包括 false 后缀。
# modelmount/modelunmount/modelheal 暂未提供，不声明兼容。
#
# /helstera debug integrations 显示监听就绪与实际接受的定义，技能/条件分别报告。
# 停用使 MM 缓存的旧代理失效；重新启用后需 /mm reload 重新解析定义。
mythicmobs:
  mobs: {}
