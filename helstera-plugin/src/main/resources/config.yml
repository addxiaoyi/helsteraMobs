# helsteraMobs 核心配置
schema-version: 1

models:
  # 模型根目录（相对插件目录或绝对路径，可多个）
  roots:
    - "plugins/helsteraMobs/models"
  auto-load: true
  strict-validation: true

render:
  view-distance: 48
  # 动画采样更新频率（每 N Tick 采样一次）
  update-rate: 1
  max-instances-per-player: 128
  hide-when-out-of-range: true
  # 显示实体插值 Tick 数（越小越跟手，越大越平滑）
  interpolation-ticks: 2
  # 可见性刷新间隔（Tick）
  visibility-refresh-ticks: 10

scheduler:
  # 每 Tick 最大实例更新数（预算）
  max-updates-per-tick: 200
  # 距离 LOD：超过该距离隔 Tick 更新
  lod-far-distance: 32.0
  lod-farther-distance: 64.0

cache:
  enabled: true
  directory: "plugins/helsteraMobs/cache"

resourcepack:
  # 留空时使用网页开发器内建下载（http://127.0.0.1:<web.port>/pack.zip）
  # 注意：0.0.0.0 不可作为下载地址，本插件会回落为 127.0.0.1。
  # 远程玩家必须填服务器真实 IP 或公网地址，例如 http://192.168.1.10:8765/pack.zip
  url: ""
  # 资源包格式号。填 auto 则按运行中服务器的 Minecraft 版本自动查表；
  # 填整数则强制使用（跨版本时若客户端不匹配会静默拒绝资源包）。
  # 已知值：1.21.1=34、1.21.2/3=42、1.21.4=46、1.21.5=55、1.21.6=63、1.21.7/8=64、1.21.9~1.21.11=69
  # 26.x（年份编号）格式号官方未公开，查表会自动回落到本项，请按客户端实测填写。
  pack-format: auto
  # 纹理限制
  max-texture-size-bytes: 1048576
  max-texture-pixels: 1024

ai:
  enabled: true
  # AI 决策间隔（Tick）
  decision-ticks: 10
  # ---- 阵营 ----
  # 阵营影响三处：目标选择跳过同伙、同阵营之间免伤、/helstera faction 可查询。
  # 未归队（档案不写 faction）= 与所有阵营敌对，这是存量配置不变的前提。
  factions:
    # 玩家所属阵营；留空表示玩家不归队。
    players: ""
    # 同阵营之间是否免伤。关掉后阵营只影响「打谁」，不影响「打不打得动」。
    block-friendly-fire: true
    factions:
      # 只需在一方声明 allies，另一侧自动对称，无需写两遍
      royal-guard:
        display: "王近卫"
        allies: [kingdom]
      kingdom:
        display: "王国"
      bandit:
        display: "山贼"
        allies: [bandit-camp]
      bandit-camp:
        display: "贼营"
  # ---- 寻路 ----
  # 仅当档案写了 can-pathfind: true 时才生效；未开启时全部走直线，行为不变。
  # 通行判定优先级：blocked-materials > passable-materials > Bukkit isPassable()
  # ---- 召唤（minion）----
  # summon 动作与 on-summon 触发器会互相触发，没有上限时一份配置就能无限套娃，
  # 表现为「生成上千只怪、服务端直接卡死」且不报错。<=0 会回落到默认值。
  summon:
    max-depth: 2        # 召唤物还能再召唤几层
    max-per-owner: 24   # 同一召唤主名下最多几只召唤物
  nav:
    # 显式视为可穿过（默认按 Bukkit 判定即可覆盖大多数情形）
    passable-materials: [oak_door, iron_door, ladder, vine, torch]
    # 显式视为不可穿过。放这里能覆盖 Bukkit 的判定，例如把水当墙来禁止涉水。
    blocked-materials: []
    # 垂直方向可爬升的格数；0 表示纯水平寻路。调大会让搜索空间膨胀。
    vertical-range: 4
  profiles:
    default:
      sight-radius: 16.0
      attack-radius: 2.2
      attack-damage: 3.0
      attack-cooldown: 1.2
      flee-health-ratio: 0.3
      patrol-radius: 8.0
      patrol-interval: 4.0
      move-speed: 0.28
      can-chase: true
      can-flee: false
      can-patrol: true
      can-attack: true
    boss:
      sight-radius: 24.0
      attack-radius: 3.0
      attack-damage: 8.0
      attack-cooldown: 1.0
      flee-health-ratio: 0.0
      patrol-radius: 6.0
      patrol-interval: 3.0
      move-speed: 0.30
      can-chase: true
      can-flee: false
      can-patrol: true
      can-attack: true
      # ---- 免疫 / 伤害倍率（对标 MythicMobs Immunities / DamageModifiers）----
      # 未配置 = 不免疫。这里不做任何默认免疫，因为漏配的表现是「怪物打不动」，
      # 比多配隐蔽得多：多配至少还有日志，漏配什么都没有。
      #
      # immunities 是免疫清单（伤害归零）；damage-modifiers 是倍率表。
      # 两者都可以写「精确 cause」或「类别名」，同名时精确 cause 优先。
      #
      # 精确 cause（Bukkit 1.21.1 的 DamageCause 常量）示例：
      #   FIRE / FIRE_TICK / LAVA / DROWNING / SUFFOCATION / STARVATION /
      #   VOID / FALL / POISON / ENTITY_ATTACK / PROJECTILE / MAGIC / THORNS ...
      #   大小写与分隔符不敏感：fire_tick、FIRE-TICK、FireTick 都成立。
      #
      # 类别名（/helstera immunity 会列出每个类别覆盖了哪些 cause）：
      #   entity-attack  近战（含横扫）      fire        火/岩浆/熔岩/热方块/仙人掌
      #   projectile     远程弹丸            fall        摔落/撞墙/坠落方块
      #   magic          法术与龙息          drowning    溺水/干燥/窒息/挤压
      #   poison         毒与凋零            explosion   爆炸
      #   environment    全部环境伤害        void        虚空与世界边界
      #   elemental      雷击与冰冻          starvation  饥饿
      #   contact/thorns/self/sonic/custom   各自对应的单一来源
      #   all            一切伤害
      #
      # 优先级：精确 cause > 类别；多条类别同时命中时「先写的那条」生效。
      #
      # 负倍率 = 回血。倍率作用于「事件原始伤害」而非已修正过的值，因此不会逐次衰减。
      #
      # 条件化：任一条规则都可带 when（单条）或 conditions（多条件，全部满足才生效）。
      # 条件名与技能 require / on-decision 用的是同一套 BehaviorRegistry，
      # 因此技能里能用的条件这里也能用。写错条件名的表现是「该条永不生效」，
      # 用 /helstera immunity 的逐 cause 试算排查。
      #
      # 条件不成立时按「该条规则不存在」处理，并继续向下匹配下一条，
      # 而不是把伤害整体冻结——所以条件规则可以和类别规则共存。
      #
      # 下面几行是示例，删掉即恢复默认（不免疫）。修改后 /helstera reload config。
      immunities: []
      # damage-modifiers:
      #   fire: 0.5              # 火伤减半（类别，覆盖 FIRE/FIRE_TICK/LAVA/...）
      #   entity-attack: -1.0    # 近战伤害转为回血
      #   PROJECTILE:            # 精确 cause：免疫箭与所有弹丸
      #     immune: true
      #   drowning: 0.25         # 溺水只剩四分之一
      #   fire:                  # 同名 key 只保留一条：免疫与倍率是同一张表
      #     when: health-below 0.3
      #     multiplier: 0.0

# 掉落表与刷怪点。
# 这两块各自独立成 loot.yml / spawners.yml（首次启动自动生成到插件目录），
# 单独成文件的原因：掉落表和刷怪点是内容型配置，会被频繁增删，
# 混在主 config.yml 里会让 reload 时把整份主配置反复重写。
#
# 生效方式：
#   mobs/<生物>.yml 里引用掉落表
#     drops:
#       table: boss_loot     # 对应 loot.yml 的 tables.<名字>
#       luck: true           # 是否计入击杀者主手的抢夺等级
#   编辑后执行 /helstera reload loot（会同时重载 spawners.yml）
loot:
  # 留空则使用插件目录下的 loot.yml
  enabled: true

spawners:
  # 留空则使用插件目录下的 spawners.yml
  enabled: true
  # 是否要求范围内有玩家才刷怪（实际门控由各刷怪点的 min-players 控制）
  require-players: false

web:
  enabled: true
  # 监听地址。默认仅监听本机（需求 3.10 要求）。
  # 只有在明确需要局域网/面板远程访问时才改为 0.0.0.0，
  # 此时任何能连到该端口的人拿到令牌即可操作，请务必用防火墙限制来源。
  host: "127.0.0.1"
  port: 8765
  # 留空则每次启动自动生成
  token: ""

debug:
  # 启动自检：启用后会在模型加载完成后延迟若干 Tick 生成一只示例生物，
  # 并把「骨骼数 / Display 实体数 / 实例有效性 / 当前动画」写入日志。
  # 用途：跨版本验证渲染层，无需人工进服或 RCON / 网页通道。
  # 代价：会在世界出生点生成一个模型。仅调试用，生产环境请保持 false。
  self-test: false
  self-test-model: "example/emberling"
  self-test-delay-ticks: 40

# 可选互通开关。全部可设为 false 而不影响核心功能（模型/动画/AI/资源包/网页/迁移）。
# MythicMobs 仅用于给已有神话生物自动绑定模型；不安装也不会有任何告警或降级。
compatibility:
  mythicmobs: true
  itemadder: true
  craftengine: true
